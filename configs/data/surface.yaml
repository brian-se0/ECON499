moneyness_points:
  - -0.30
  - -0.20
  - -0.10
  - -0.05
  - 0.00
  - 0.05
  - 0.10
  - 0.20
  - 0.30
maturity_days:
  - 1
  - 7
  - 14
  - 30
  - 60
  - 90
  - 180
  - 365
  - 730
interpolation_order:
  - "maturity"
  - "moneyness"
interpolation_cycles: 2
# Outside the observed maturity range, carry the boundary implied volatility forward
# (total variance proportional to maturity). Along moneyness the boundary total variance
# is carried forward, which is the same flat implied volatility at a fixed maturity.
maturity_boundary_fill: "flat_implied_volatility"
total_variance_floor: 1.0e-8
observed_cell_min_count: 1

